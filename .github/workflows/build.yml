name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Android debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 platform
        run: sdkmanager "platforms;android-36"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
             dist/BrylTab-Bouncer-Glass-v0.1.3.apk
          cd dist
          sha256sum BrylTab-Bouncer-Glass-v0.1.3.apk \
            > BrylTab-Bouncer-Glass-v0.1.3.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BrylTab-Bouncer-Glass-v0.1.3
          if-no-files-found: error
          path: |
            dist/BrylTab-Bouncer-Glass-v0.1.3.apk
            dist/BrylTab-Bouncer-Glass-v0.1.3.apk.sha256
